name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build unsigned iOS app
      run: |
        xcodebuild \
          -project HyjhVideo.xcodeproj \
          -scheme HyjhVideo \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          ONLY_ACTIVE_ARCH=NO \
          build

    - name: Package IPA
      run: |
        APP_PATH="build/Build/Products/Release-iphoneos/HyjhVideo.app"
        if [ ! -d "$APP_PATH" ]; then
          APP_PATH=$(find build/Build/Products -name "HyjhVideo.app" -type d | head -1)
        fi
        echo "App path: $APP_PATH"
        ls -la "$APP_PATH"
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r HyjhVideo.ipa Payload
        rm -rf Payload
        ls -la HyjhVideo.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HyjhVideo-ipa
        path: HyjhVideo.ipa
        retention-days: 30
